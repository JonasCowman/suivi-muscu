<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muscu">
<title>Suivi muscu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#000000;--card:#121417;--card2:#1b1e22;--line:#2a2e33;--cyan:#22d3ee;--cyan-d:#0e7490;--txt:#e6edf3;--mut:#8b9bab;--warn:#fbbf24;--ok:#34d399;--danger:#f87171;color-scheme:dark}
@font-face{font-family:Barlow;font-weight:400;font-display:swap;src:url(fonts/barlow-400.woff2) format('woff2')}
@font-face{font-family:Barlow;font-weight:500;font-display:swap;src:url(fonts/barlow-500.woff2) format('woff2')}
@font-face{font-family:Barlow;font-weight:600;font-display:swap;src:url(fonts/barlow-600.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:600;font-display:swap;src:url(fonts/barlowcond-600.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url(fonts/barlowcond-700.woff2) format('woff2')}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Barlow,-apple-system,"Segoe UI",sans-serif}
button,input,select{font-family:inherit}
h1,h2,.disp,.pill,.ringtxt b,#rest .t,.metric b,b,input[type=number]{font-family:'Barlow Condensed',Barlow,sans-serif}
h1{text-transform:uppercase;letter-spacing:.4px;font-weight:700!important;font-size:24px!important}
h2{text-transform:uppercase;letter-spacing:.8px;font-size:15px!important;color:var(--mut)}
.disp{font-weight:600;font-size:20px;letter-spacing:.2px}
input[type=number]{font-weight:600;font-size:17px}
.ringtxt b{font-size:44px!important;font-weight:700!important}
#view{padding:calc(env(safe-area-inset-top) + 14px) 16px 150px;max-width:520px;margin:0 auto}
h1{font-size:21px;font-weight:600;margin:4px 0 2px}
h2{font-size:16px;font-weight:600;margin:22px 0 10px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--cyan);color:#04252c}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:7px;border:1px solid var(--line);color:var(--mut);margin:4px 4px 0 0}
.tag.c{border-color:var(--cyan-d);color:var(--cyan)}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14px}
.banner.mid{background:#2b2410;color:var(--warn);border:1px solid #5a4a14}
.banner.high{background:#2e1515;color:var(--danger);border:1px solid #5c2424}
.banner.info{background:#0d2a31;color:var(--cyan);border:1px solid var(--cyan-d)}
button{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button.primary{background:var(--cyan);color:#04252c;border-color:var(--cyan);font-weight:600}
button.ghost{background:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);flex:none}
.dot.done{background:var(--ok)}
.chev{color:var(--mut);font-size:20px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;background:none;padding:0}
.check.on{background:var(--cyan);border-color:var(--cyan);color:#04252c}
.chips{display:flex;gap:6px;overflow-x:auto;margin:6px 0 12px}
.chips button{white-space:nowrap;padding:7px 12px;font-size:13px}
.chips button.on,button.on-sel{border-color:var(--cyan);color:var(--cyan)}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.bar>div{height:100%;background:var(--cyan)}
:is(.zones,.lvls){display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
:is(.zones,.lvls) button{min-height:44px}
.lvls button{flex:1;padding:10px 6px}
.lvl0{color:var(--ok)}.lvl1{color:var(--warn)}.lvl2{color:var(--danger)}
.lvl0.on{background:var(--ok)}.lvl1.on{background:var(--warn)}.lvl2.on{background:var(--danger)}
.lvls .on{color:#000;font-weight:600}
table.sets{width:100%;border-collapse:collapse;margin-top:8px}
table.sets caption{text-align:left;padding:4px}
table.sets th{font-size:11px;color:var(--mut);font-weight:500;text-align:left;padding:4px}
table.sets td{padding:4px}
table.sets td:last-child{width:52px}
table.sets tr.cur td{background:var(--card2)}
table.sets input,table.sets select{min-height:44px;font-size:17px}
table.sets select{width:100%;min-width:58px;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px}
table.sets .check{width:44px;height:44px}
input[type=number],input[type=date]{width:100%;font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
input:focus{outline:none;border-color:var(--cyan)}
input[type=range]{width:100%;accent-color:var(--cyan)}
label.chk{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
label.chk input{width:22px;height:22px;accent-color:var(--cyan)}
.err{color:var(--danger);font-size:13px;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:var(--card2);border-radius:10px;padding:10px}
.metric b{display:block;font-size:19px}
#rest{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));display:none;justify-content:center;padding:8px}
#rest .in{background:var(--card);border:1px solid var(--cyan-d);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:14px;max-width:488px;width:100%}
#rest svg{flex:none}
#rest .t{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.warnchip{display:inline-block;margin-top:8px;font-size:12px;padding:4px 9px;border-radius:7px;border:1px solid var(--cyan-d);color:var(--cyan);background:#06181c}
.timer{display:flex;align-items:center;justify-content:space-between;margin:18px 0}
.ring{position:relative;width:180px;height:180px}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt b{font-size:38px;font-weight:600;font-variant-numeric:tabular-nums}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.bottom button{padding:14px}
body.focus nav{display:none!important}
body.focus #rest{bottom:calc(76px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;background:#0a0b0d;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{background:none;border:none;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 10px}
nav button.on{color:var(--cyan)}
nav svg{width:22px;height:22px}
</style>
</head>
<body>
<main id="view"></main>
<div id="rest"><div class="in">
  <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="none" stroke="#2a2e33" stroke-width="5"/><circle id="ring" cx="32" cy="32" r="28" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-dasharray="175.9" stroke-dashoffset="0" transform="rotate(-90 32 32)"/></svg>
  <div style="flex:1"><div class="t" id="restT">0:00</div><div class="mut">Temps de repos</div></div>
  <button data-a="rest-add">+30 s</button><button data-a="rest-skip">Passer</button>
</div></div>
<nav>
  <button data-tab="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</button>
  <button data-tab="work"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Workout</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analytics</button>
  <button data-tab="prof"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profile</button>
</nav>
<script src="logic.js"></script>
<script src="programme-defaut.js"></script>
<script src="body-data.js"></script>
<script src="body.js"></script>
<script src="app.js"></script>
</body>
</html>
